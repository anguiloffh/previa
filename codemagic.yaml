# Compila la app de iPhone en un Mac de Codemagic y la sube a TestFlight.
# Se lanza a mano desde codemagic.io (Start new build → ios-testflight).
# Necesita en Codemagic: Team/Personal settings → Integrations → Developer Portal,
# una clave de API de App Store Connect llamada "Previa ASC".
workflows:
  ios-testflight:
    name: iPhone a TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 40
    integrations:
      app_store_connect: Previa ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.previagame.app
      node: 24
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: npm ci
      - name: Armar www y copiar a iOS
        script: npm run build && npx cap sync ios
      - name: Firma
        script: xcode-project use-profiles
      - name: Versión (la misma de Android) y número de build
        script: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          cd ios/App
          agvtool new-marketing-version "$VERSION"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Compilar el .ipa
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
