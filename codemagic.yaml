# Compila la app de iPhone en un Mac de Codemagic y la sube a TestFlight.
# Se lanza a mano desde codemagic.io (Start new build → elegir el flujo).
# Necesita en Codemagic: Settings → Integrations → Developer Portal, una clave de API de
# App Store Connect llamada "Previa ASC", y el certificado y perfil de distribución.
#
# Dos flujos:
# - ios-testflight: para probar. En iPhone usa los anuncios de prueba de Google (siempre hay uno).
# - ios-appstore:   la build que se envía a la App Store, con los anuncios reales.

definitions:
  scripts: &scripts
    - name: Instalar dependencias
      script: npm ci
    - name: Armar www y copiar a iOS
      script: npm run build && npx cap sync ios
    - name: Firma
      script: xcode-project use-profiles
    - name: Versión (la misma de Android) y número de build
      script: |
        VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
        cd ios/App
        agvtool new-marketing-version "$VERSION"
        # Número de build único entre los dos flujos (BUILD_NUMBER cuenta por flujo y se repetía)
        agvtool new-version -all "$PROJECT_BUILD_NUMBER"
    - name: Compilar el .ipa
      script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
  ios_signing: &ios_signing
    distribution_type: app_store
    bundle_identifier: com.previagame.app

workflows:
  ios-testflight:
    name: iPhone a TestFlight (anuncios de prueba)
    instance_type: mac_mini_m2
    max_build_duration: 40
    integrations:
      app_store_connect: Previa ASC
    environment:
      ios_signing: *ios_signing
      vars:
        PREVIA_TEST_ADS: "1"
      node: 24
      xcode: latest
    scripts: *scripts
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false

  ios-appstore:
    name: iPhone para la App Store (anuncios reales)
    instance_type: mac_mini_m2
    max_build_duration: 40
    integrations:
      app_store_connect: Previa ASC
    environment:
      ios_signing: *ios_signing
      node: 24
      xcode: latest
    scripts: *scripts
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
